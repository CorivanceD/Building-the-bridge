<VirtualHost *:80>
    DocumentRoot /var/www/vhosts/buildingthebridge.eu/domains/buildingthebridge.eu/public_html
    <Directory /var/www/vhosts/buildingthebridge.eu/domains/buildingthebridge.eu/public_html>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
<VirtualHost *:443>
    DocumentRoot /var/www/vhosts/buildingthebridge.eu/domains/buildingthebridge.eu/public_html
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/localhost.crt
    SSLCertificateKeyFile /etc/apache2/ssl/localhost.key
    <Directory /var/www/vhosts/buildingthebridge.eu/domains/buildingthebridge.eu/public_html>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
